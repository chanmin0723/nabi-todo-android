name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDirectDebug --stacktrace
      - name: Verify Play (store) flavor builds
        run: |
          set +e
          ./gradlew bundleStoreRelease --stacktrace > store.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            { grep -B1 -A4 -E "Error:|Fatal:" store.log; cat app/build/reports/lint-results-storeRelease.txt 2>/dev/null | head -40; } | head -40 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-400)"; done
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: nabi-todo-debug-apk
          path: app/build/outputs/apk/direct/debug/*.apk
      - name: Publish release (no login needed to download)
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/direct/debug/app-direct-debug.apk nabi-todo.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" nabi-todo.apk \
            --title "나비 할 일 $TAG" \
            --notes "커밋: ${{ github.sha }}" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
