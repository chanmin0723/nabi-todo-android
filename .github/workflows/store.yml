name: Build Play Store bundle

# Actions 탭 -> "Build Play Store bundle" -> Run workflow
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore upload keystore from secrets
        env:
          STORE_KEYSTORE_B64: ${{ secrets.STORE_KEYSTORE_B64 }}
        run: |
          if [ -z "$STORE_KEYSTORE_B64" ]; then
            echo "::error::STORE_KEYSTORE_B64 secret is missing (see STORE.md)"; exit 1
          fi
          echo "$STORE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "STORE_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Build signed AAB (store flavor)
        env:
          STORE_KEYSTORE_PASSWORD: ${{ secrets.STORE_KEYSTORE_PASSWORD }}
          STORE_KEY_ALIAS: ${{ secrets.STORE_KEY_ALIAS }}
          STORE_KEY_PASSWORD: ${{ secrets.STORE_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew bundleStoreRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nabi-todo-store-aab
          path: app/build/outputs/bundle/storeRelease/*.aab
